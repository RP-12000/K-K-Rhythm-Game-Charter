buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {
    // the Android plugin (same version as the game's), only when settings.gradle includes the android module
    if (findProject(':android') != null) classpath 'com.android.tools.build:gradle:9.1.0'
  }
}

plugins {
  id 'java'
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }

  ext {
    shapedrawerVersion = '2.5.0'
    // The game project this editor builds against (its chart model, loader and renderers).
    // Change gameDir in gradle.properties if the game folder moves.
    gameDir = rootProject.file(rootProject.findProperty('gameDir') ?: '../K and K Rhythm Game')
  }
  repositories {
    maven { url 'https://jitpack.io' }
  }
}

configure(subprojects.findAll { it.name != 'android' }) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 11

  dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-core:2.17.0'
    implementation "space.earlygrey:shapedrawer:$shapedrawerVersion"
  }

  // From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
  // The article can be helpful when using assets.txt in your project.
  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    // projectFolder/assets
    File assetsFolder = new File("${project.rootDir}/assets/")
    // projectFolder/assets/assets.txt
    File assetsFile = new File(assetsFolder, "assets.txt")
    // delete that file in case we've already created it
    assetsFile.delete()

    // iterate through all files inside that folder
    // convert it to a relative path
    // and append it to the file assets.txt
    fileTree(assetsFolder).matching { exclude 'backups/**', 'trash/**', '.lwjgl/**' }.collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'K & K Rhythm Game Charter'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'K & K Rhythm Game Charter' + '-parent'
